<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEO SD</title>
<style>
@property --h1{syntax:'<number>';inherits:true;initial-value:265}
@property --h2{syntax:'<number>';inherits:true;initial-value:220}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#07070d;--tx:#f3f2fb;--mut:#a09dc0;--dim:#615e80;--line:rgba(255,255,255,.14);--acc:#9a8cff;--ok:#3ddc9a;--warn:#f5b860;
--h1:265;--h2:220;transition:--h1 1.8s ease-in-out,--h2 1.8s ease-in-out;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#amb{position:fixed;inset:-25%;z-index:0;filter:blur(50px);animation:drift 28s ease-in-out infinite alternate;
background:radial-gradient(38% 38% at 24% 22%,hsl(var(--h1) 85% 48%/.55),transparent 70%),radial-gradient(42% 42% at 80% 78%,hsl(var(--h2) 80% 42%/.5),transparent 70%)}
@keyframes drift{to{transform:translate(4%,3%) rotate(6deg) scale(1.08)}}
.g{background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.035));border:1px solid var(--line);
backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);
box-shadow:0 24px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2);border-radius:24px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:18px 24px 24px;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 10px 20px;border-radius:999px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.04em}
.logo i{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--acc),hsl(var(--h2) 80% 55%));box-shadow:0 0 18px hsl(var(--h1) 90% 60%/.6)}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.tabs button{padding:8px 24px;border-radius:999px;color:var(--mut);font-weight:600;transition:.25s}
.tabs button.on{background:rgba(255,255,255,.16);color:var(--tx);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.sd{display:flex;align-items:center;gap:10px;padding:7px 16px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.sd b{color:var(--tx);font-weight:600}.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.sd.in .dot{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.bar{width:54px;height:5px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}.bar i{display:block;height:100%;width:52%;background:var(--acc)}
main{flex:1;min-height:0;display:flex}
.view{display:none;flex:1;min-width:0;min-height:0;gap:18px;animation:in .4s ease}.view.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
/* detalhes */
aside{width:310px;flex:none;display:flex;flex-direction:column;padding:16px;gap:12px}
aside input{width:100%;padding:11px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--tx);font:inherit;outline:0}
aside input:focus{border-color:var(--acc)}
.list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.li{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:14px;cursor:pointer;border:1px solid transparent;transition:.2s;position:relative}
.li:hover{background:rgba(255,255,255,.07)}
.li.sel{background:rgba(255,255,255,.13);border-color:var(--line)}
.li.sel::before{content:"";position:absolute;left:-1px;top:20%;bottom:20%;width:3px;border-radius:3px;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.li.off .ic,.li.off .nm{opacity:.45}
.ic{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:700;background:linear-gradient(150deg,hsl(var(--h1) 70% 48%),hsl(var(--h2) 60% 20%))}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sb{font-size:12px;color:var(--mut)}
.det{flex:1;position:relative;overflow:hidden;padding:36px 40px;display:flex;gap:40px;align-items:flex-start}
.det::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,hsl(var(--h1) 75% 45%/.4),transparent 55%);pointer-events:none}
.det>*{position:relative;animation:in .5s ease}
.det.swap>*{opacity:0;transition:opacity .18s}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv.has small,.cv.has h3{display:none}
.cv.land img{object-fit:contain}.cvb{position:absolute;inset:-14%;background:center/cover no-repeat;filter:blur(18px) brightness(.5) saturate(1.3)}
.tile.land{width:calc(224px*var(--ia));transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s,margin .3s}.tile.land.sel{margin:0 calc(224px*var(--ia)*.11 - 10px)}.tile.land .cv{aspect-ratio:var(--ia)}
.det .cv.land{width:calc(360px*var(--ia));max-width:560px;aspect-ratio:var(--ia)}
.gwc.land{width:calc(240px*var(--ia))}.gwc.land .cv{aspect-ratio:var(--ia)}
.ic{overflow:hidden}.ic img{width:100%;height:100%;object-fit:cover}
.cv{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;padding:16px;display:flex;flex-direction:column;justify-content:space-between;
background:linear-gradient(160deg,hsl(var(--h1) 70% 44%),hsl(var(--h2) 65% 13%));box-shadow:0 30px 70px hsl(var(--h1) 80% 35%/.5),0 0 0 1px rgba(255,255,255,.18) inset}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.28),transparent 38%);pointer-events:none}
.cv small{font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.75}.cv h3{font-size:1.35em;line-height:1.1;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.det .cv{width:270px;flex:none}.det .cv h3{font-size:30px}
.info{flex:1;min-width:0}h1{font-size:44px;line-height:1.05;letter-spacing:-.02em}
.badges{display:flex;gap:8px;margin:14px 0 22px;flex-wrap:wrap}
.bd{padding:3px 12px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(255,255,255,.1);border:1px solid var(--line)}
.bd.ok{color:var(--ok);border-color:rgba(61,220,154,.4);background:rgba(61,220,154,.1)}.bd.warn{color:var(--warn);border-color:rgba(245,184,96,.4);background:rgba(245,184,96,.1)}
.play{display:inline-flex;align-items:center;gap:10px;padding:14px 38px;border-radius:999px;font-weight:700;font-size:16px;color:#120e2b;
background:linear-gradient(180deg,#fff,#d9d4ff);box-shadow:0 10px 34px hsl(var(--h1) 90% 60%/.55);transition:.2s}
.play:hover{transform:translateY(-2px) scale(1.03)}.play.dis{background:rgba(255,255,255,.1);color:var(--dim);box-shadow:none;border:1px solid var(--line);cursor:not-allowed;transform:none}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0 22px;max-width:620px}
.meta div{padding:12px 16px;border-radius:16px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08)}
.meta span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}.meta b{font-weight:600}
.desc{max-width:620px;color:var(--mut);font-size:15px;line-height:1.6}
/* biblioteca */
.lib{flex:1;padding:28px;overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.lib h2{font-size:22px;margin-bottom:4px}.lib p{color:var(--mut);margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:24px 20px}
.card{cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1)}.card:hover{transform:translateY(-8px) scale(1.04)}
.card .cv{box-shadow:0 14px 34px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.14) inset;transition:.3s}
.card:hover .cv{box-shadow:0 24px 50px hsl(var(--h1) 80% 40%/.6),0 0 0 2px rgba(255,255,255,.6) inset}
.card.off .cv{filter:grayscale(.85) brightness(.6)}
.card .t{margin-top:10px;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{position:absolute;top:10px;right:10px;z-index:2;padding:2px 9px;border-radius:999px;font-size:10px;font-weight:700;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:1px solid var(--line)}
/* botão modo console */
#cbtn{position:fixed;right:28px;bottom:26px;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;font-weight:600;transition:.25s}
#cbtn:hover{transform:translateY(-3px);box-shadow:0 14px 40px hsl(var(--h1) 90% 55%/.5),inset 0 1px 0 rgba(255,255,255,.25)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* modo console */
#con{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;padding:24px 56px 20px;background:var(--bg);overflow:hidden}
#con.on{display:flex;animation:in .5s ease}
#con>.ctop,#con>#cmain,#con>.hint{position:relative;z-index:1}
#cbg{position:absolute;inset:0;z-index:0;overflow:hidden;background:radial-gradient(60% 60% at 20% 15%,hsl(var(--h1) 80% 30%/.55),transparent 70%),radial-gradient(60% 60% at 85% 90%,hsl(var(--h2) 80% 28%/.5),transparent 70%)}
.bgl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .9s ease}.bgl.on{opacity:1}
/* banner do jogo: largura da tela, preso no topo, sem cortar; a base some atrás da fileira de jogos */
.bgl.ban{bottom:auto;background-position:center top;-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 62%,rgba(0,0,0,.55) 82%,transparent 100%);mask-image:linear-gradient(180deg,#000 0%,#000 62%,rgba(0,0,0,.55) 82%,transparent 100%)}
#cbg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,5,10,.82) 0%,rgba(5,5,10,.35) 42%,rgba(5,5,10,0) 70%),linear-gradient(0deg,rgba(5,5,10,.9) 0%,rgba(5,5,10,.35) 22%,rgba(5,5,10,0) 40%),linear-gradient(180deg,rgba(5,5,10,.45) 0%,rgba(5,5,10,0) 14%)}
.ctop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;color:var(--mut);font-weight:600}
.clogo{display:flex;gap:10px;align-items:center;color:var(--tx);letter-spacing:.04em;font-weight:700}.clogo i{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,var(--acc),hsl(var(--h2) 80% 55%))}
.ctabs{display:flex;gap:8px;align-items:center;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.4);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.ctab{padding:10px 26px;border-radius:999px;color:var(--mut);font-weight:700;font-size:15px;transition:.25s}.ctab.on{background:rgba(255,255,255,.92);color:#0b0b16}
.kb{display:inline-grid;place-items:center;min-width:32px;height:24px;padding:0 8px;border-radius:8px;border:1.5px solid var(--mut);color:var(--mut);font-size:11px;font-weight:700;font-style:normal}
.ctop .r{display:flex;gap:18px;align-items:center;justify-content:flex-end;font-size:14px}.ctop .tm{font-size:22px;color:var(--tx);font-weight:500}
#cmain{flex:1;min-height:0;display:flex;flex-direction:column}
.hero{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:26px;max-width:780px}
.hero h1{font-size:64px;text-shadow:0 4px 30px rgba(0,0,0,.5)}.hero .badges{margin:14px 0}
.hero p{color:#c9c6e2;font-size:17px;max-width:600px;margin-bottom:22px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(max-height:700px){.hero h1{font-size:40px;line-height:1.05}.hero .badges{margin:8px 0}.hero p{display:none}.hero{padding-bottom:12px}.row{padding-top:56px;padding-bottom:40px}}
.row{flex:none;display:flex;align-items:flex-end;gap:26px;overflow:hidden;padding:70px 44px 48px;margin:0 -44px}
.tile{flex:none;width:168px;transform-origin:50% 100%;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s;opacity:.7;cursor:pointer}
.tile .cv{width:100%}.tile.sel{opacity:1;transform:scale(1.22)}
.tile.sel .cv{box-shadow:0 0 0 3px #fff,0 0 26px hsl(var(--h1) 90% 62%/.7),0 16px 28px rgba(0,0,0,.45)}
.tile.off .cv{filter:grayscale(.85) brightness(.6)}
.hint{display:flex;gap:30px;justify-content:center;color:var(--mut);font-size:13px;margin-top:6px;min-height:28px}
.hint span{display:flex;align-items:center;gap:8px}
body.incon #app,body.incon #amb{display:none}
.cf.fx{outline:3px solid #fff;outline-offset:4px;box-shadow:0 0 30px hsl(var(--h1) 90% 62%/.65)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:30px;padding:44px 44px 56px;margin:0 -44px;overflow:auto;align-content:start;scrollbar-width:none;scroll-padding:44px}
.capp{display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;padding:26px 14px;border-radius:24px;background:linear-gradient(150deg,hsl(var(--h1) 55% 32%/.8),hsl(var(--h2) 55% 14%/.9));border:1px solid var(--line);transition:transform .25s}
.capp.fx{transform:scale(1.06)}.capp b{font-size:16px;text-align:center}.aic{width:84px;height:84px;border-radius:22px;display:grid;place-items:center;font-size:32px;font-weight:800;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);overflow:hidden}.aic.has{background:rgba(255,255,255,.1);padding:10px}.aic img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
.cset{flex:1;min-height:0;display:flex;gap:28px;padding-top:26px}
.cnav{width:290px;flex:none;display:flex;flex-direction:column;gap:10px}
.cni{padding:17px 22px;border-radius:16px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08);color:var(--mut);font-weight:700;font-size:16px;text-align:left}.cni.on{background:rgba(255,255,255,.15);color:var(--tx)}
.cpane{flex:1;overflow:auto;padding:14px 14px 30px;margin:-10px -14px 0;scroll-padding:14px;scrollbar-width:none}
.cpane .ph{font-size:28px;margin-bottom:4px;background:none}.pd{color:var(--mut);margin-bottom:16px;line-height:1.55}
.crowi{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;padding:16px 22px;border-radius:16px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.08);margin-bottom:10px;text-align:left}
.crowi span b{display:block;font-size:17px}.crowi span i{font-style:normal;color:var(--mut);font-size:13px}.crowi em{font-style:normal;color:var(--mut);font-weight:700}.crowi:disabled{opacity:.4}
.ps{margin:24px 0 10px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:18px}
.sw{width:54px;height:30px;border-radius:999px;background:rgba(255,255,255,.2);position:relative;flex:none;transition:.2s}.sw u{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--ok)}.sw.on u{left:27px}
.lgh{display:flex;align-items:center;gap:8px;padding:14px 10px 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);cursor:pointer;user-select:none}
.lgh b{color:var(--mut);font-weight:700}.lgh span{margin-left:auto;font-size:11px}.lgh i{font-style:normal;display:inline-block;transition:transform .2s}.lgh.fold i{transform:rotate(-90deg)}
.ggh{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;margin:14px 0 -6px;font-size:15px;font-weight:700}.ggh:first-child{margin-top:0}.ggh span{color:var(--dim);font-size:13px;font-weight:500}
.syss{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin:8px 0 22px}
.sysc{position:relative;text-align:left;padding:18px;border-radius:18px;min-height:104px;background:linear-gradient(135deg,hsl(var(--h1) 55% 30%/.8),hsl(var(--h2) 55% 16%/.85));border:1px solid rgba(255,255,255,.1);overflow:hidden;cursor:pointer;transition:transform .2s}
.sysc:hover{transform:translateY(-2px)}.sysc b{display:block;font-size:15px;line-height:1.25;max-width:85%}.sysc span{color:rgba(255,255,255,.7);font-size:12.5px}.sysc.on{outline:2px solid var(--acc);outline-offset:2px}
.sysc em{position:absolute;right:14px;bottom:8px;font-style:normal;font-size:38px;font-weight:800;opacity:.22}
.emg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin:8px 0 22px}
.emc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 12px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);text-align:center;cursor:pointer;transition:.2s}
.emc:hover{background:rgba(255,255,255,.08)}.emc img,.emc .lg{width:100%;height:58px;object-fit:contain}.emc .lg{display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--mut)}
.emc b{font-size:12.5px;line-height:1.3}.emc .bd{font-size:10.5px;padding:3px 8px}
.cgh{grid-column:1/-1;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:6px 0 -14px}.cgh:not(:first-child){margin-top:18px}
.capp.csys{align-items:flex-start;justify-content:flex-end;min-height:150px;text-align:left;position:relative;overflow:hidden}.capp.csys b{text-align:left;font-size:18px}.capp.csys i{font-style:normal;color:rgba(255,255,255,.7);font-size:13px}
.capp.csys em{position:absolute;right:18px;top:12px;font-style:normal;font-size:46px;font-weight:800;opacity:.2}
.capp.cemu .aic{width:150px;height:72px;border-radius:14px}.capp.cemu small{font-size:11.5px;color:var(--mut)}.capp.cemu.miss{opacity:.72}
.cgame{padding:0!important;background:none!important;border:0!important;gap:10px!important}.cgame .cv{width:100%!important}.cgame b{font-size:14px!important}
.cgrid.games{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.cabout{padding:16px 20px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:6px;max-width:900px}.cabout .s{font-size:14px;line-height:1.6;color:var(--mut)}
.cemlogo{width:84px;height:34px;object-fit:contain;flex:none}.crowi .eml{display:flex;align-items:center;gap:16px}
.sysf{display:flex;align-items:center;gap:8px;margin:4px 6px 8px;padding:8px 12px;border-radius:12px;background:hsl(var(--h1) 60% 50%/.14);border:1px solid var(--line);font-size:12.5px}.sysf b{flex:1}.sysf button{font-size:12px;color:var(--mut)}
.ilc{font-family:ui-monospace,Consolas,monospace;font-size:.92em;background:rgba(255,255,255,.09);padding:2px 7px;border-radius:6px;color:var(--tx);white-space:nowrap}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px;margin:6px 0 14px}
.wall{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:#111 center/cover no-repeat;padding:0;cursor:pointer;transition:border-color .2s}
.wall:hover{border-color:rgba(255,255,255,.35)}.wall b{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 9px;font-size:13px;font-weight:600;text-align:left;color:#fff;background:linear-gradient(0deg,rgba(0,0,0,.78),transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wall.on{border:2px solid var(--acc)}.wall.on::after{content:"✓";position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:900}
.wall.add{display:grid;place-items:center;background:rgba(255,255,255,.05);border-style:dashed;color:var(--mut);font-weight:700;font-size:14px}
.wall .wx{position:absolute;top:7px;left:7px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:none;place-items:center;font-size:12px}.wall:hover .wx{display:grid}

 {id:"ff9",n:"Final Fantasy IX",genre:"RPG",dev:"Square",year:"2000",size:"—",time:"—",s:"disc",h:[200,250],d:"Zidane e Garnet numa aventura em Gaia.",sys:"psx",sysn:"Sony PlayStation",lt:"disc",platform:"PlayStation",drive:"",discs:4,disc_n:0,rating:null});

function profPane(){const p=profAct();if(!p)return`<h2 class="ph">Perfil</h2><p class="pd">Crie um perfil com nome e foto (só neste PC). As conquistas viram troféus e nível.</p><button class="crowi cf" data-ca="pfnew" data-fk="pf:new"><span><b>Criar perfil</b></span><em>Criar</em></button>`;
 return`<div class="phd">${avHTML(p.avatar,96,p.name)}<div style="flex:1"><h2>${esc(p.name)}</h2><p>${p.xp} XP · faltam ${p.lvl_need-p.lvl_xp} para o nível ${p.level+1}</p></div>${lvRing(p)}</div>${trRow(p)}
 <button class="crowi cf" data-ca="pfname" data-fk="pf:name"><span><b>Nome</b><i>${esc(p.name)}</i></span><em>Editar</em></button>
 <button class="crowi cf" data-ca="pfav" data-fk="pf:av"><span><b>Foto</b><i>Ícones do NEO SD ou uma foto do PC</i></span><em>Trocar</em></button>
 <button class="crowi cf" data-ca="pfwho" data-fk="pf:who"><span><b>Trocar de usuário</b><i>${PROF.profiles.length} perfi${PROF.profiles.length===1?"l":"s"} neste PC</i></span><em>Trocar</em></button>
 <button class="crowi cf" data-ca="pfnew" data-fk="pf:new"><span><b>Adicionar usuário</b></span><em>Adicionar</em></button>
 <button class="crowi cf" data-ca="pfask" data-fk="pf:ask"><span><b>Perguntar quem está jogando</b><i>Ao abrir o modo console</i></span>${sw(PROF.ask)}</button>
 <button class="crowi cf" data-ca="pfsync" data-fk="pf:sync"><span><b>Atualizar troféus</b><i>Bronze 15 XP, prata 30, ouro 90, platina 300 (jogo 100%)</i></span><em>Atualizar</em></button>
 ${PROF.profiles.length>1?`<button class="crowi cf" data-ca="pfdel" data-fk="pf:del"><span><b>Remover este perfil</b><i>Os troféus passam para o primeiro perfil</i></span><em>Remover</em></button>`:""}`}
$("#cmain").addEventListener("click",async e=>{const t=e.target.closest("[data-ca]");if(!t||!/^pf/.test(t.dataset.ca))return;const a=FA(),ca=t.dataset.ca,p=profAct(),back=()=>{cnClose();CN.fxKey="pf:"+ca.slice(2);cnSettings()};
 if(ca==="pfnew")cnProfNew(back);
 else if(ca==="pfname")oskOpen({title:"Nome do perfil",value:p.name,done:async v=>{if(v.trim()){await a.profile_save({id:p.id,name:v.trim()});await profLoad()}back()},back});
 else if(ca==="pfav")cnAvPick(p.avatar,async av=>{await a.profile_save({id:p.id,name:p.name,avatar:av});await profLoad();back()},back,p.id);
 else if(ca==="pfwho")profWho();
 else if(ca==="pfask"){PROF.ask=!PROF.ask;await a.profile_ask(PROF.ask);cnSettings()}
 else if(ca==="pfsync"){toast("Atualizando os troféus…");a.profile_sync()}
 else if(ca==="pfdel"){const r=await a.profile_delete(p.id);PROF=r.state;profChips();cnSettings();toast("Perfil removido")}});
$("#cdlgi").addEventListener("click",async e=>{const t=e.target.closest("[data-da]");if(!t||!/^p(w|av)/.test(t.dataset.da))return;const da=t.dataset.da,a=FA();
 if(da==="pwsel"){const r=await a.profile_select(t.dataset.id);PROF=r.state;profChips();cnClose();toast("Olá, "+(profAct()||{}).name+"!");if(CN.tab===2)cnSettings()}
 else if(da==="pwadd")cnProfNew(ok=>{if(ok){cnClose();if(CN.tab===2)cnSettings()}else profWho()});
 else if(da==="pavp"){const f=CN.avDone;if(f)f(t.dataset.av)}
 else if(da==="pavf"){const pid=CN.avPid,r=await a.profile_photo(pid);if(r.state){PROF=r.state;profChips()}if(r.ok){toast("Foto trocada");CN.back&&CN.back()}else if(!r.cancel)toast(r.msg,1)}});
window.discIn=p=>{if(p.running)return;let n=0;const go=()=>{const i=G.findIndex(g=>g.id===p.id);if(i<0){if(++n<15)setTimeout(go,200);return}  // espera a biblioteca recarregar
 const g=G[i];if(p.status==="joined")toast("💿 Disco "+p.disc_n+" de "+g.n+" adicionado ao jogo");
 if(p.popup){if(S.con){if(g.sys&&!CN.rbin){if(CN.tab!==3)cnTab(3);if(CN.esys!==g.sys)cnSysEnter(g.sys)}S.ci=i;cnSel()}else if(S.tab==="det"&&!$("#mod").classList.contains("on"))pick(i);
  if(S.con||!$("#mod").classList.contains("on"))discSetup(p.id);return}
 if(S.con){if($("#cdlg").classList.contains("on"))return;
  if(g.sys&&!CN.rbin){if(CN.tab!==3)cnTab(3);if(CN.esys!==g.sys)cnSysEnter(g.sys);S.ci=i;cnSel()}  // disco de PS2 abre em Emuladores → PS2
  else{if(CN.tab!==0)cnTab(0);S.ci=i;cnSel()}}
 else if(S.tab==="det"){if(S.sysf&&S.sysf!==g.sys){S.sysf="";render()}pick(i)}};setTimeout(go,150)};window.sdTick=i=>{S.sd=!!i;if(i)S.info=i;sd()};window.consoleWake=()=>{if(!S.con)setCon(true)};
addEventListener("pywebviewready",()=>load().then(wizardCheck));
if(!API()&&!INAPP){setTimeout(wizardCheck,500);profLoad()} // só na prévia do navegador
addEventListener("pywebviewready",()=>{profLoad();FA().update_status().then(st=>{UPD=st});FA().retrobat_setup_status().then(st=>{RBS=st;rbsPill()});FA().sfx_status().then(st=>Object.assign(SFXST,st))});
</script>
